<script>
  var SB_URL = "https://zrjitdmgrwwkiofeoslz.supabase.co";
  var SB_KEY = "sb_publishable_5nUhMV36KGLmhmI_AyjYsA_Lf3mBw9s";

  var session = null;
  try { session = JSON.parse(localStorage.getItem("sbSession")); } catch (e) {}

  function saveSession(s) {
    session = s;
    try {
      if (s) {
        localStorage.setItem("sbSession", JSON.stringify({
          access_token: s.access_token,
          refresh_token: s.refresh_token
        }));
      } else {
        localStorage.removeItem("sbSession");
      }
    } catch (e) {}
  }

  function rawFetch(method, path, body, prefer) {
    var headers = { "apikey": SB_KEY, "Content-Type": "application/json" };
    if (session) { headers["Authorization"] = "Bearer " + session.access_token; }
    if (prefer) { headers["Prefer"] = prefer; }
    var opts = { method: method, headers: headers };
    if (body !== undefined) { opts.body = JSON.stringify(body); }
    return fetch(SB_URL + path, opts);
  }

  function refreshSession() {
    if (!session || !session.refresh_token) { return Promise.resolve(false); }
    return fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function (r) {
      if (!r.ok) { return false; }
      return r.json().then(function (j) { saveSession(j); return true; });
    }).catch(function () { return false; });
  }

  function api(method, path, body, prefer) {
    return rawFetch(method, path, body, prefer).then(function (r) {
      if (r.status === 401 && session) {
        return refreshSession().then(function (ok) {
          if (!ok) {
            saveSession(null);
            updateAuthUI();
            throw new Error("Сессия закончилась, войди заново");
          }
          return rawFetch(method, path, body, prefer);
        });
      }
      return r;
    }).then(function (r) {
      if (!r.ok) {
        return r.text().then(function (t) { throw new Error(t || String(r.status)); });
      }
      return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  function toggleLogin() {
    var box = document.getElementById("login-box");
    box.style.display = (box.style.display === "none") ? "block" : "none";
  }

  function doLogin() {
    var email = document.getElementById("login-email").value.trim();
    var pass = document.getElementById("login-pass").value;
    var err = document.getElementById("login-error");
    err.textContent = "";

    fetch(SB_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: pass })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (x) {
      if (!x.ok) { err.textContent = "Неверная почта или пароль"; return; }
      saveSession(x.j);
      document.getElementById("login-pass").value = "";
      document.getElementById("login-box").style.display = "none";
      updateAuthUI();
      loadHomework();
    }).catch(function () {
      err.textContent = "Нет связи с базой. Проверь VPN и интернет.";
    });
  }

    saveSession(null);
    attStudents = []; attDates = []; attMarks = {};
    updateAuthUI();
    if (document.getElementById("poseshaemost").style.display === "block") {
      показать("raspisanie");
    }
  }

  function updateAuthUI() {
    var logged = !!session;
    document.getElementById("auth-status").textContent =
      logged ? "Вы вошли как староста/зам" : "Просмотр без входа";
    document.getElementById("login-open").style.display = logged ? "none" : "inline-block";
    document.getElementById("logout-btn").style.display = logged ? "inline-block" : "none";
    document.getElementById("tab-att").style.display = logged ? "inline-block" : "none";
    document.getElementById("hw-form").style.display = logged ? "block" : "none";
    showHomework();
  }
</script>
<script>
  var homework = [];

  function formatDate(d) {
    if (!d) { return ""; }
    var parts = d.split("-");
    return parts[2] + "." + parts[1] + "." + parts[0];
  }

  function loadHomework() {
    api("GET", "/rest/v1/homework?select=*&order=due.asc.nullslast,id.asc")
      .then(function (data) {
        homework = data || [];
        document.getElementById("hw-message").textContent = "";
        showHomework();
      })
      .catch(function () {
        document.getElementById("hw-message").textContent =
          "Не удалось загрузить задания. Проверь интернет (нужен VPN).";
      });
  }

  function addHomework() {
    var subject = document.getElementById("dz-subject").value;
    var task = document.getElementById("dz-task").value.trim();
    var due = document.getElementById("dz-date").value;

    if (subject === "" || task === "") {
      alert("Выбери предмет и впиши задание");
      return;
    }

    api("POST", "/rest/v1/homework",
        { subject: subject, task: task, due: due === "" ? null : due, done: false },
        "return=minimal")
      .then(function () {
        document.getElementById("dz-subject").value = "";
        document.getElementById("dz-task").value = "";
        document.getElementById("dz-date").value = "";
        loadHomework();
      })
      .catch(function (e) { alert("Не получилось сохранить: " + e.message); });
  }

  function toggleHomework(id, done) {
    api("PATCH", "/rest/v1/homework?id=eq." + id, { done: !done }, "return=minimal")
      .then(loadHomework)
      .catch(function (e) { alert("Не получилось: " + e.message); });
  }

  function deleteHomework(id) {
    if (!confirm("Удалить задание?")) { return; }
    api("DELETE", "/rest/v1/homework?id=eq." + id)
      .then(loadHomework)
      .catch(function (e) { alert("Не получилось: " + e.message); });
  }

  function makeToggle(id, done) { return function () { toggleHomework(id, done); }; }
  function makeDelete(id) { return function () { deleteHomework(id); }; }

  function showHomework() {
    var list = document.getElementById("dz-list");
    list.innerHTML = "";
    var logged = !!session;

    for (var i = 0; i < homework.length; i++) {
      var item = homework[i];

      var li = document.createElement("li");
      if (item.done) { li.className = "done"; }

      if (logged) {
        var box = document.createElement("input");
        box.type = "checkbox";
        box.checked = item.done;
        box.onchange = makeToggle(item.id, item.done);
        li.appendChild(box);
      }

      var text = document.createElement("span");
      var line = item.subject + ": " + item.task;
      if (item.due) { line = line + " (до " + formatDate(item.due) + ")"; }
      text.textContent = line;
      li.appendChild(text);

      if (logged) {
        var del = document.createElement("button");
        del.textContent = "Удалить";
        del.onclick = makeDelete(item.id);
        li.appendChild(del);
      }

      list.appendChild(li);
    }
  }
</script>
<script>
  var attStudents = [];
  var attDates = [];
  var attMarks = {};

  var markNames = ["", "был", "не был", "болеет"];
  var markClasses = ["", "present", "absent", "sick"];
  var monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
                    "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

  var nowDate = new Date();
  var attMonth = nowDate.getFullYear() + "-" + String(nowDate.getMonth() + 1).padStart(2, "0");

  function shortDate(d) {
    var parts = d.split("-");
    return parts[2] + "." + parts[1];
  }

  function nextMonthStart(ym) {
    var parts = ym.split("-");
    var y = Number(parts[0]);
    var m = Number(parts[1]) + 1;
    if (m > 12) { m = 1; y = y + 1; }
    return y + "-" + String(m).padStart(2, "0") + "-01";
  }

  function loadAttendance() {
    if (!session) { return; }
    var first = attMonth + "-01";
    var next = nextMonthStart(attMonth);

    Promise.all([
      api("GET", "/rest/v1/students?select=id,name&order=id.asc"),
      api("GET", "/rest/v1/att_dates?select=day&order=day.asc"),
      api("GET", "/rest/v1/att_marks?select=student_id,day,mark&day=gte." + first + "&day=lt." + next)
    ]).then(function (res) {
      attStudents = res[0] || [];
      attDates = (res[1] || []).map(function (r) { return r.day; });
      attMarks = {};
      (res[2] || []).forEach(function (r) {
        attMarks[r.student_id + "|" + r.day] = r.mark;
      });
      document.getElementById("att-message").textContent = "";
      showAttendance();
    }).catch(function (e) {
      document.getElementById("att-message").textContent =
        "Не удалось связаться с базой: " + e.message;
    });
  }

  function changeMonth(delta) {
    var parts = attMonth.split("-");
    var y = Number(parts[0]);
    var m = Number(parts[1]) + delta;
    if (m < 1) { m = 12; y = y - 1; }
    if (m > 12) { m = 1; y = y + 1; }
    attMonth = y + "-" + String(m).padStart(2, "0");
    loadAttendance();
  }

  function addDate() {
    var date = document.getElementById("att-date").value;
    if (date === "") { alert("Выбери дату"); return; }

    api("POST", "/rest/v1/att_dates", { day: date }, "return=minimal")
      .then(function () {
        attMonth = date.substring(0, 7);
        document.getElementById("att-date").value = "";
        loadAttendance();
      })
      .catch(function (e) {
        if (e.message.indexOf("23505") !== -1) {
          alert("Такая дата уже есть");
        } else {
          alert("Не получилось: " + e.message);
        }
      });
  }

  function deleteDate(date) {
    if (!confirm("Удалить дату " + shortDate(date) + " и все отметки за этот день?")) { return; }
    api("DELETE", "/rest/v1/att_dates?day=eq." + date)
      .then(loadAttendance)
      .catch(function (e) { alert("Не получилось: " + e.message); });
  }

  function clickMark(studentId, day) {
    var key = studentId + "|" + day;
    var newValue = ((attMarks[key] || 0) + 1) % 4;
    attMarks[key] = newValue;
    showAttendance();

    var request;
    if (newValue === 0) {
      request = api("DELETE", "/rest/v1/att_marks?student_id=eq." + studentId + "&day=eq." + day);
    } else {
      request = api("POST", "/rest/v1/att_marks",
                    { student_id: studentId, day: day, mark: newValue },
                    "resolution=merge-duplicates,return=minimal");
    }
    request.catch(function (e) {
      alert("Отметка не сохранилась: " + e.message);
      loadAttendance();
    });
  }

  function makeMarkClick(s, d) { return function () { clickMark(s, d); }; }
  function makeDeleteDate(d) { return function () { deleteDate(d); }; }

  function showAttendance() {
    var mp = attMonth.split("-");
    document.getElementById("att-month-label").textContent =
      monthNames[Number(mp[1]) - 1] + " " + mp[0];

    var visible = [];
    for (var v = 0; v < attDates.length; v++) {
      if (attDates[v].substring(0, 7) === attMonth) { visible.push(attDates[v]); }
    }

    var table = document.getElementById("att-table");
    table.innerHTML = "";

    var head = document.createElement("tr");
    var corner = document.createElement("th");
    corner.textContent = "Студент";
    head.appendChild(corner);

    for (var j = 0; j < visible.length; j++) {
      var th = document.createElement("th");
      th.appendChild(document.createTextNode(shortDate(visible[j])));
      var del = document.createElement("button");
      del.className = "del-date";
      del.textContent = "×";
      del.onclick = makeDeleteDate(visible[j]);
      th.appendChild(del);
      head.appendChild(th);
    }
    table.appendChild(head);

    for (var i = 0; i < attStudents.length; i++) {
      var st = attStudents[i];
      var row = document.createElement("tr");

      var nameCell = document.createElement("td");
      nameCell.className = "name";
      nameCell.textContent = st.name;
      row.appendChild(nameCell);

      for (var k = 0; k < visible.length; k++) {
        var value = attMarks[st.id + "|" + visible[k]] || 0;
        var cell = document.createElement("td");
        cell.className = "mark " + markClasses[value];
        cell.textContent = markNames[value];
        cell.onclick = makeMarkClick(st.id, visible[k]);
        row.appendChild(cell);
      }
      table.appendChild(row);
    }
  }

  // ---- Запуск ----
  updateAuthUI();
  loadHomework();

  setInterval(function () {
    if (document.hidden) { return; }
    if (document.getElementById("dz").style.display === "block") { loadHomework(); }
    if (document.getElementById("poseshaemost").style.display === "block") { loadAttendance(); }
  }, 60000);
</script>
<script>
  // ---------- Файлы в хранилище ----------
  function fileUrl(path) {
    return SB_URL + "/storage/v1/object/public/files/" + path;
  }

  function uploadFile(file, folder, allowed) {
    var ext = (file.name.split(".").pop() || "").toLowerCase();
    if (allowed.indexOf(ext) === -1) {
      return Promise.reject(new Error("Можно загружать только: " + allowed.join(", ")));
    }
    if (file.size > 5 * 1024 * 1024) {
      return Promise.reject(new Error("Файл больше 5 МБ"));
    }
    var path = folder + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;

    return refreshSession().then(function () {
      if (!session) { throw new Error("Войди заново"); }
      return fetch(SB_URL + "/storage/v1/object/files/" + path, {
        method: "POST",
        headers: {
          "apikey": SB_KEY,
          "Authorization": "Bearer " + session.access_token,
          "Content-Type": file.type || "application/octet-stream"
        },
        body: file
      });
    }).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { throw new Error(t); }); }
      return path;
    });
  }

  function deleteFile(path) {
    if (!path) { return Promise.resolve(); }
    return api("DELETE", "/storage/v1/object/files/" + path).catch(function () {});
  }

  // ---------- Домашние задания с картинкой ----------
  function addHomework() {
    var subject = document.getElementById("dz-subject").value;
    var task = document.getElementById("dz-task").value.trim();
    var due = document.getElementById("dz-date").value;
    var file = document.getElementById("dz-file").files[0];

    if (subject === "" || task === "") {
      alert("Выбери предмет и впиши задание");
      return;
    }

    var upload = file ? uploadFile(file, "homework", ["png", "jpg", "jpeg", "pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "txt"]) : Promise.resolve(null);

    upload.then(function (path) {
      return api("POST", "/rest/v1/homework",
        { subject: subject, task: task, due: due === "" ? null : due, done: false, image_path: path, file_name: file ? file.name : null },
        "return=minimal");
    }).then(function () {
      document.getElementById("dz-subject").value = "";
      document.getElementById("dz-task").value = "";
      document.getElementById("dz-date").value = "";
      document.getElementById("dz-file").value = "";
      loadHomework();
    }).catch(function (e) { alert("Не получилось сохранить: " + e.message); });
  }

  function deleteHomework(id, path) {
    if (!confirm("Удалить задание?")) { return; }
    api("DELETE", "/rest/v1/homework?id=eq." + id)
      .then(function () { return deleteFile(path); })
      .then(loadHomework)
      .catch(function (e) { alert("Не получилось: " + e.message); });
  }

  function makeDelete(id, path) { return function () { deleteHomework(id, path); }; }

  function showHomework() {
    var list = document.getElementById("dz-list");
    list.innerHTML = "";
    var logged = !!session;

    for (var i = 0; i < homework.length; i++) {
      var item = homework[i];

      var li = document.createElement("li");
      if (item.done) { li.className = "done"; }

      if (logged) {
        var box = document.createElement("input");
        box.type = "checkbox";
        box.checked = item.done;
        box.onchange = makeToggle(item.id, item.done);
        li.appendChild(box);
      }

      var text = document.createElement("span");
      var line = item.subject + ": " + item.task;
      if (item.due) { line = line + " (до " + formatDate(item.due) + ")"; }
      text.textContent = line;
      li.appendChild(text);

      if (logged) {
        var del = document.createElement("button");
        del.textContent = "Удалить";
        del.onclick = makeDelete(item.id, item.image_path);
        li.appendChild(del);
      }

      if (item.image_path) {
        var isImg = /\.(png|jpe?g)$/i.test(item.image_path);
        var link = document.createElement("a");
        link.href = fileUrl(item.image_path);
        link.target = "_blank";
        link.rel = "noopener";
        if (isImg) {
          var img = document.createElement("img");
          img.className = "thumb";
          img.src = fileUrl(item.image_path);
          img.alt = "Картинка к заданию";
          link.appendChild(img);
        } else {
          link.textContent = "Файл: " + (item.file_name || "открыть");
          link.style.display = "block";
          link.style.marginTop = "8px";
        }
        li.appendChild(link);
      }
      list.appendChild(li);
    }
  }

  // ---------- Зачёты ----------
  var exams = [];

  function todayString() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function loadExams() {
    api("GET", "/rest/v1/exams?select=*&order=day.asc")
      .then(function (data) {
        exams = data || [];
        document.getElementById("ex-message").textContent = "";
        showExams();
      })
      .catch(function () {
        document.getElementById("ex-message").textContent =
          "Не удалось загрузить зачёты. Проверь интернет (нужен VPN).";
      });
  }

  function addExam() {
    var subject = document.getElementById("ex-subject").value;
    var day = document.getElementById("ex-date").value;
    var req = document.getElementById("ex-req").value.trim();
    var file = document.getElementById("ex-file").files[0];

    if (subject === "" || day === "") {
      alert("Выбери предмет и дату");
      return;
    }

    var upload = file ? uploadFile(file, "exams",["png", "jpg", "jpeg", "pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "txt"]) : Promise.resolve(null);

    upload.then(function (path) {
      return api("POST", "/rest/v1/exams",
        { subject: subject, day: day, requirements: req, file_path: path, file_name: file ? file.name : null },
        "return=minimal");
    }).then(function () {
      document.getElementById("ex-subject").value = "";
      document.getElementById("ex-date").value = "";
      document.getElementById("ex-req").value = "";
      document.getElementById("ex-file").value = "";
      loadExams();
    }).catch(function (e) { alert("Не получилось сохранить: " + e.message); });
  }

  function deleteExam(id, path) {
    if (!confirm("Удалить зачёт?")) { return; }
    api("DELETE", "/rest/v1/exams?id=eq." + id)
      .then(function () { return deleteFile(path); })
      .then(loadExams)
      .catch(function (e) { alert("Не получилось: " + e.message); });
  }

  function makeDeleteExam(id, path) { return function () { deleteExam(id, path); }; }

  function showExams() {
    var list = document.getElementById("ex-list");
    list.innerHTML = "";
    var today = todayString();

    for (var i = 0; i < exams.length; i++) {
      var ex = exams[i];
      var li = document.createElement("li");
      if (ex.day < today) { li.className = "past"; }

      if (session) {
        var del = document.createElement("button");
        del.className = "del-btn";
        del.textContent = "Удалить";
        del.onclick = makeDeleteExam(ex.id, ex.file_path);
        li.appendChild(del);
      }

      var title = document.createElement("b");
      title.textContent = formatDate(ex.day) + " — " + ex.subject;
      li.appendChild(title);

      if (ex.requirements) {
        var req = document.createElement("div");
        req.className = "req";
        req.textContent = ex.requirements;
        li.appendChild(req);
      }

      if (ex.file_path) {
        var a = document.createElement("a");
        a.href = fileUrl(ex.file_path);
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "Билеты: " + (ex.file_name || "открыть файл");
        li.appendChild(a);
      }

      list.appendChild(li);
    }
  }

  // ---------- Полезные ссылки ----------
  var linksData = [];

  function loadLinks() {
    api("GET", "/rest/v1/links?select=*&order=id.asc")
      .then(function (data) {
        linksData = data || [];
        document.getElementById("link-message").textContent = "";
        showLinks();
      })
      .catch(function () {
        document.getElementById("link-message").textContent =
          "Не удалось загрузить ссылки. Проверь интернет (нужен VPN).";
      });
  }

  function addLink() {
    var title = document.getElementById("link-title").value.trim();
    var url = document.getElementById("link-url").value.trim();
    var note = document.getElementById("link-note").value.trim();

    if (url.charAt(0) === "@") { url = "https://t.me/" + url.slice(1); }
    if (/^t\.me\//i.test(url)) { url = "https://" + url; }

    if (title === "" || !/^https?:\/\//i.test(url)) {
      alert("Впиши название и ссылку (https://... или @канал)");
      return;
    }

    api("POST", "/rest/v1/links", { title: title, url: url, note: note === "" ? null : note }, "return=minimal")
      .then(function () {
        document.getElementById("link-title").value = "";
        document.getElementById("link-url").value = "";
        document.getElementById("link-note").value = "";
        loadLinks();
      })
      .catch(function (e) { alert("Не получилось сохранить: " + e.message); });
  }

  function deleteLink(id) {
    if (!confirm("Удалить ссылку?")) { return; }
    api("DELETE", "/rest/v1/links?id=eq." + id)
      .then(loadLinks)
      .catch(function (e) { alert("Не получилось: " + e.message); });
  }

  function makeDeleteLink(id) { return function () { deleteLink(id); }; }

  function showLinks() {
    var list = document.getElementById("link-list");
    list.innerHTML = "";

    for (var i = 0; i < linksData.length; i++) {
      var item = linksData[i];
      var li = document.createElement("li");

      if (session) {
        var del = document.createElement("button");
        del.className = "del-btn";
        del.textContent = "Удалить";
        del.onclick = makeDeleteLink(item.id);
        li.appendChild(del);
      }

      var a = document.createElement("a");
      a.textContent = item.title;
      if (/^https?:\/\//i.test(item.url)) {
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener";
      }
      var b = document.createElement("b");
      b.appendChild(a);
      li.appendChild(b);

      if (item.note) {
        var n = document.createElement("div");
        n.className = "req";
        n.textContent = item.note;
        li.appendChild(n);
      }

      list.appendChild(li);
    }
  }

  // ---------- Кнопки вкладок и показ форм ----------
  function openTab(id) {
    (window.showTab || window["показать"])(id);
  }

  function addTabButton(text, id) {
    var nav = document.querySelector("nav");
    var b = document.createElement("button");
    b.textContent = text;
    b.onclick = function () { openTab(id); };
    nav.insertBefore(b, document.getElementById("tab-att"));
  }

  function updateExtraUI() {
    var logged = !!session;
    document.getElementById("ex-form").style.display = logged ? "block" : "none";
    document.getElementById("link-form").style.display = logged ? "block" : "none";
    showExams();
    showLinks();
  }

  var _baseUpdateAuthUI = updateAuthUI;
  updateAuthUI = function () {
    _baseUpdateAuthUI();
    updateExtraUI();
  };

  addTabButton("Зачёты", "exams");
  addTabButton("Полезные ссылки", "links");

  updateExtraUI();
  loadExams();
  loadLinks();

  setInterval(function () {
    if (document.hidden) { return; }
    if (document.getElementById("exams").style.display === "block") { loadExams(); }
    if (document.getElementById("links").style.display === "block") { loadLinks(); }
  }, 60000);
</script>
